spring.application.name=minijam

# Maler leses på nytt ved Ctrl+F9, uten omstart
spring.thymeleaf.cache=false

# JS og CSS leses rett fra src/, så endringer vises med F5 i nettleseren,
# uten Build. Finnes ikke mappen (feil arbeidsmappe), brukes classpath.
spring.web.resources.static-locations=file:src/main/resources/static/,classpath:/static/
