<!DOCTYPE html>
<html lang="no" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${rom.navn}">Rom</title>
</head>
<body>
<h1 th:text="${rom.navn}">Romnavn</h1>

<p>Du er i [[${rom.navn}]]. Her er det
  [[${rom.angripbare.size()}]] angripbare.</p>

<table>
  <thead>
  <tr><th>#</th><th>Navn</th><th>Hp</th><th>Status</th></tr>
  </thead>
  <tbody>
  <tr th:each="m, stat : ${rom.angripbare}">
    <td th:text="${stat.count}">1</td>
    <td th:text="${m.navn}">Rottekonge</td>
    <td th:text="${m.hp}">20</td>
    <td th:text="${m.lever} ? 'lever' : 'drept'">lever</td>
  </tr>
  </tbody>
</table>
<p th:if="${rom.angripbare.isEmpty()}">Ingen her.</p>

<h2>Skatter</h2>
<ul>
  <li th:each="s : ${rom.skatter}"
      th:text="|${s.navn} (${s.verdi})|">skatt (8)</li>
</ul>

<h2>Nytt monster</h2>
<p th:if="${melding}" th:text="${melding}" style="color: green">Lagt til</p>
<p th:if="${feilmelding}" th:text="${feilmelding}" style="color: red">Feil</p>
<fieldset>
  <form novalidate th:action="@{/rom/{nr}/monstre(nr=${nr})}" th:object="${skjema}"
        method="post">
    <label for="navn">Navn </label>
    <input id="navn" th:field="*{navn}" required>
    <label for="hp">HP </label>
    <input id="hp" th:field="*{hp}" type="number" min="1" max="999" required>
    <label><input type="radio" th:field="*{tilstand}" value="frisk">
      frisk</label>
    <label><input type="radio" th:field="*{tilstand}" value="skadet">
      skadet</label>
    <button>Legg til</button>
  </form>
</fieldset>

<p><a th:href="@{/}">Tilbake til spillet</a></p>



</body>
</html>
