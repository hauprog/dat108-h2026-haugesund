<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>LockedIn</title>
    <link rel="stylesheet" href="spill.css">
    <script src="lyd.js" defer></script>
    <script src="spill.js" defer></script>
</head>
<body>
<header class="topp">
    <div>
        <p class="sted">LockedIn</p>
        <h1 id="romnavn">Laster rommet ...</h1>
    </div>
    <nav>
        <button type="button" id="innkall">Kall inn et monster</button>
        <button type="button" id="lydknapp" aria-pressed="false">Lyd av</button>
        <a href="/rom/7">Bygg monstre</a>
    </nav>
</header>

<main class="oppsett">
    <section aria-labelledby="monstre-tittel">
        <h2 id="monstre-tittel">Monstre</h2>
        <p class="hint">Klikk på et monster for å angripe det.</p>
        <div id="arena" class="arena"></div>
    </section>

    <aside>
        <section aria-labelledby="skatter-tittel">
            <h2 id="skatter-tittel">Skatter</h2>
            <ul id="skatter" class="skatter"></ul>
        </section>
        <section aria-labelledby="logg-tittel">
            <h2 id="logg-tittel">Logg</h2>
            <ol id="logg" class="logg" aria-live="polite"></ol>
        </section>
    </aside>
</main>

<p id="feil" class="feil" role="alert" hidden></p>
</body>
</html>
