spring.application.name=lockedin-app
spring.thymeleaf.cache=false
logging.level.org.springframework.web=DEBUG
spring.jpa.show-sql=true

# F23: feilmeldingen fra ResponseStatusException og feltene som feilet
# valideringen kommer med i svaret. Greit under utvikling, ikke i drift.
spring.web.error.include-message=always
spring.web.error.include-binding-errors=always

# F23: API-noekkelen. Fra miljoevariabelen API_NOKKEL hvis den finnes,
# ellers en noekkel til utvikling. Den ekte noekkelen skal aldri i git.
lockedin.api-nokkel=${API_NOKKEL:dev-nokkel-123}
